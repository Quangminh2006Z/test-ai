services:
  - type: web
    name: gia-su-toan-8-api
    runtime: node
    buildCommand: npm ci
    startCommand: node server/index.js
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_TEXT_MODEL
        value: llama-3.1-8b-instant
      - key: GROQ_VISION_MODEL
        value: meta-llama/llama-4-maverick-17b-128e-instruct
